name: Build & Release Packs

# Only queues a run when a push touches a manifest.json somewhere in the
# repo. pack_builder.py then checks git history to see whether
# header.version in any touched (non-excluded) manifest actually changed -
# not just whether the file was touched, and not caring which direction it
# changed. If it did, every pack gets rebuilt.
#
# The only thing you MUST change per-repo is the branch name below.
on:
  push:
    branches: [master] # <-- CHANGE this to your repo's default branch
    paths:
      - "**/manifest.json"
  workflow_dispatch: # manual "Run workflow" button - always force-builds everything

env:
  RELEASE_TITLE: Automated Build # <-- optional: prefix for each release's title, e.g. "Automated Build (5 August 2026)"
  BUNDLE_NAME_PREFIX: All-Packs-Bundled # <-- optional: name for the bundle .mcaddon (year.month.day is always appended)
  ENHANCEMENTS_DIR_NAME: __enhancements # <-- optional: change if this repo uses a different folder name (this is a folder/branch of resource pack is developed separately, but is merged down only for public builds)
  EXCLUDE_PATHS: "Vanilla-RTX-BTU, __VAULT" # <-- optional: comma-separated repo-relative folders to fully ignore
  RELEASE_NOTES_FOOTER: |
    Download and import each individual `.mcpack`, or get the top `.mcaddon` file which bundles all `.mcpack` files in one package.

    Use the Vanilla RTX App to launch Minecraft with RTX, import and activate one of the provided Vanilla RTX resource packs, and you're good to go! You can also use the app to automatically update the packs in the future instead of manually downloading them from here.

permissions:
  contents: write # needed to create/delete the Release and its tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the version-diff check has something to compare against

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version bump & build packs
        id: build
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 .github/workflows/pack_builder.py

      # Tags/releases are now just release-<date>, with no run-number
      # tie-breaker. If this is the 2nd+ build today, the tag from the
      # earlier run already exists - action-gh-release would just update
      # it in place, but wouldn't clean up any stale per-pack files from
      # the earlier build. Deleting it first guarantees every same-day
      # rebuild is a clean slate instead of slowly accumulating old assets.
      - name: Remove today's release if one already exists
        if: steps.build.outputs.should_build == 'true' && steps.build.outputs.pack_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "release-${{ steps.build.outputs.iso_date }}" --yes --cleanup-tag || true

      - name: Create Release
        if: steps.build.outputs.should_build == 'true' && steps.build.outputs.pack_count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ steps.build.outputs.iso_date }}
          name: "${{ env.RELEASE_TITLE }} (${{ steps.build.outputs.human_date }})"
          body_path: RELEASE_NOTES.md
          files: dist/*
